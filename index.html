<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Racing Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', 'Arial Black', sans-serif;
      user-select: none;
    }
    #game-wrapper {
      position: relative;
      border: 4px solid #e10600;
      border-radius: 16px;
      box-shadow: 0 0 80px rgba(225,6,0,.35), 0 0 160px rgba(225,6,0,.08);
    }
    canvas { display: block; border-radius: 12px; }
    #ui {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 12px 18px;
      display: flex; justify-content: space-between;
      pointer-events: none; z-index: 10;
    }
    .ui-box {
      background: rgba(0,0,0,.75);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: 8px 14px; color: #fff;
    }
    .ui-box .lbl {
      font-size: 9px; letter-spacing: 2px; color: #e10600; font-weight: 700;
      text-transform: uppercase;
    }
    .ui-box .val {
      font-size: 26px; font-weight: 900; letter-spacing: 1px; line-height: 1.1;
    }
    #boost-outer {
      width: 90px; height: 7px; background: rgba(255,255,255,.1);
      border-radius: 4px; margin-top: 4px; overflow: hidden;
    }
    #boost-inner {
      height: 100%; background: linear-gradient(90deg,#ffcc00,#ff6600);
      border-radius: 4px; transition: width .08s;
    }
    #start-screen, #gameover-screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: rgba(0,0,0,.82); z-index: 20;
      border-radius: 12px;
    }
    #start-screen h1, #gameover-screen h1 {
      font-size: 52px; color: #e10600;
      text-shadow: 0 0 40px rgba(225,6,0,.6);
      letter-spacing: 3px; margin-bottom: 8px;
    }
    #start-screen .sub, #gameover-screen .sub {
      color: #ccc; font-size: 16px; margin-bottom: 28px;
    }
    #start-screen .ctrl {
      display: flex; gap: 20px; margin-bottom: 28px; color: #aaa; font-size: 13px;
    }
    #start-screen .ctrl span { color: #ffcc00; font-weight: 700; }
    button {
      background: linear-gradient(135deg,#e10600,#c00000);
      color: #fff; border: none; padding: 14px 48px;
      font-size: 20px; font-weight: 800; letter-spacing: 2px;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 8px 30px rgba(225,6,0,.4);
      transition: transform .15s, box-shadow .15s;
    }
    button:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 40px rgba(225,6,0,.55);
    }
    #gameover-screen .final {
      font-size: 36px; color: #ffcc00; font-weight: 900;
      margin-bottom: 6px;
    }
    #gameover-screen .best {
      font-size: 15px; color: #aaa; margin-bottom: 24px;
    }
    #mobile-controls {
      display: none; position: absolute; bottom: 12px; left: 12px; right: 12px;
      justify-content: space-between; z-index: 30; pointer-events: none;
    }
    .mbtn {
      pointer-events: auto;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
      color: #fff; font-size: 28px; width: 56px; height: 56px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .mbtn:active { background: rgba(255,255,255,.3); }
    @media (max-width: 700px) {
      #mobile-controls { display: flex; }
      canvas { max-width: 100vw; max-height: 100vh; }
      #start-screen h1, #gameover-screen h1 { font-size: 34px; }
      #start-screen .ctrl { font-size: 11px; gap: 10px; }
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="c"></canvas>

  <div id="ui">
    <div class="ui-box">
      <div class="lbl">Score</div>
      <div class="val" id="score">0</div>
    </div>
    <div class="ui-box">
      <div class="lbl">Speed</div>
      <div class="val" style="color:#00ff88;" id="speed">0</div>
    </div>
    <div class="ui-box">
      <div class="lbl">Boost</div>
      <div id="boost-outer"><div id="boost-inner" style="width:100%"></div></div>
    </div>
  </div>

  <div id="start-screen">
    <h1>F1 RACING</h1>
    <div class="sub">Dodge rivals  |  Collect boosts  |  Survive!</div>
    <div class="ctrl">
      <span>← →</span> Steer &nbsp;&nbsp; <span>↑</span> Boost &nbsp;&nbsp; <span>P</span> Pause
    </div>
    <button onclick="startGame()">START RACE</button>
  </div>

  <div id="gameover-screen" style="display:none;">
    <h1>RACE OVER</h1>
    <div class="final" id="final-score">0</div>
    <div class="best" id="best-score">Best: 0</div>
    <button onclick="startGame()">RACE AGAIN</button>
  </div>

  <div id="mobile-controls">
    <button class="mbtn" id="btn-left">◀</button>
    <button class="mbtn" id="btn-boost">🔥</button>
    <button class="mbtn" id="btn-right">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 400, H = 700;
canvas.width = W;
canvas.height = H;

const ROAD_LEFT = 60;
const ROAD_RIGHT = W - 60;
const ROAD_W = ROAD_RIGHT - ROAD_LEFT;
const LANES = [ROAD_LEFT + 47, ROAD_LEFT + 93, ROAD_LEFT + 140, ROAD_LEFT + 186, ROAD_LEFT + 233];

let game = null;
let bestScore = parseInt(localStorage.getItem('f1best') || '0');
document.getElementById('best-score').textContent = 'Best: ' + bestScore;

// --- Car drawing ---
function drawCar(x, y, w, h, color, accent) {
  ctx.save();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x - w/2 + 3, y + 2, w, h);
  // body
  const g = ctx.createLinearGradient(x - w/2, y, x + w/2, y);
  g.addColorStop(0, color);
  g.addColorStop(0.5, accent);
  g.addColorStop(1, color);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w/2 + 4, y);
  ctx.lineTo(x - w/2, y + 8);
  ctx.lineTo(x - w/2, y + h - 4);
  ctx.lineTo(x - w/2 + 4, y + h);
  ctx.lineTo(x + w/2 - 4, y + h);
  ctx.lineTo(x + w/2, y + h - 4);
  ctx.lineTo(x + w/2, y + 8);
  ctx.lineTo(x + w/2 - 4, y);
  ctx.closePath();
  ctx.fill();
  // cockpit
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(x - w/6, y + h*.45, w/3, h*.25);
  // wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(x - w/2 - 3, y + h*.1, 7, h*.2);
  ctx.fillRect(x + w/2 - 4, y + h*.1, 7, h*.2);
  ctx.fillRect(x - w/2 - 3, y + h*.65, 7, h*.2);
  ctx.fillRect(x + w/2 - 4, y + h*.65, 7, h*.2);
  // halo
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - w/4, y + 8);
  ctx.lineTo(x - w/4, y + h*.35);
  ctx.lineTo(x + w/4, y + h*.35);
  ctx.lineTo(x + w/4, y + 8);
  ctx.stroke();
  ctx.restore();
}

function drawPlayerCar(x, y) {
  drawCar(x, y, 32, 52, '#e10600', '#ff4444');
  // number
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('44', x, y + 48);
}

function drawRivalCar(x, y, colorIdx) {
  const colors = [
    ['#00d2ff','#66e8ff'], ['#ff8c00','#ffb366'], ['#7b2fbe','#b366ff'],
    ['#00ff55','#66ff99'], ['#ffdd00','#ffee66'], ['#ff3366','#ff6699']
  ];
  const ci = ((colorIdx || 0) % colors.length + colors.length) % colors.length;
  // glow to make rivals stand out
  ctx.save();
  ctx.shadowColor = colors[ci][1];
  ctx.shadowBlur = 8;
  drawCar(x, y, 34, 54, colors[ci][0], colors[ci][1]);
  ctx.restore();
}

// --- Track ---
let trackOffset = 0;

function drawTrack() {
  // grass
  ctx.fillStyle = '#1a5c1a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#228B22';
  for (let y = 0; y < H; y += 20) {
    const off = (trackOffset + y) % 40;
    ctx.fillRect(ROAD_LEFT - 28, y, 28, 12 + off * .15);
    ctx.fillRect(ROAD_RIGHT, y, 28, 12 + off * .15);
  }
  // road
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(ROAD_LEFT, 0, ROAD_W, H);
  // texture
  ctx.fillStyle = 'rgba(255,255,255,.02)';
  for (let y = 0; y < H; y += 6) {
    ctx.fillRect(ROAD_LEFT, y, ROAD_W, 3);
  }
  // kerbs red/white
  for (let y = 0; y < H; y += 16) {
    const oy = (trackOffset + y) % 32;
    ctx.fillStyle = oy < 16 ? '#e10600' : '#fff';
    ctx.fillRect(ROAD_LEFT - 8, y, 8, 16);
    ctx.fillStyle = oy < 16 ? '#fff' : '#e10600';
    ctx.fillRect(ROAD_RIGHT, y, 8, 16);
  }
  // lane dashes
  ctx.setLineDash([20, 20]);
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = 2;
  for (let i = 1; i < LANES.length; i++) {
    const lx = (LANES[i-1] + LANES[i]) / 2;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.lineDashOffset = -trackOffset;
  // start/finish line
  const sfY = (-trackOffset % 300 + 300) % 300;
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 5; col++) {
      ctx.fillStyle = (row % 2 === 0) ? '#fff' : '#111';
      ctx.fillRect(ROAD_LEFT + col * ROAD_W/5, sfY + row * 12, ROAD_W/5, 12);
    }
  }
}

// --- Game state ---
class Game {
  constructor() {
    this.playerX = LANES[2];
    this.playerY = H - 120;
    this.baseSpeed = 4;
    this.speed = this.baseSpeed;
    this.score = 0;
    this.boost = 100;
    this.boosting = false;
    this.rivals = [];
    this.sparks = [];
    this.rivalTimer = -180;
    this.rivalInterval = 80;
    this.alive = true;
    this.paused = false;
    this.keys = {};
    this.frame = 0;
    this.crashing = false;
    this.crashTimer = 0;
    this.invincible = 180;
  }

  spawnRival() {
    const lane = LANES[Math.floor(Math.random() * LANES.length)];
    for (const r of this.rivals) {
      if (Math.abs(r.x - lane) < 30 && r.y < 80) return;
    }
    const colorIdx = Math.floor(Math.random() * 6);
    this.rivals.push({
      x: lane, y: -60,
      speed: this.baseSpeed - 1 + Math.random() * 2,
      colorIdx
    });
  }

  addSparks(x, y) {
    for (let i = 0; i < 6; i++) {
      this.sparks.push({
        x, y,
        vx: (Math.random() - .5) * 4,
        vy: (Math.random() - .5) * 4,
        life: 12 + Math.random() * 10,
        color: Math.random() < .5 ? '#ffcc00' : '#ff6600'
      });
    }
  }

  update() {
    if (this.paused) return;

    // crash animation runs even when not alive
    if (this.crashing) {
      this.crashTimer--;
      for (const s of this.sparks) {
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
      }
      this.sparks = this.sparks.filter(s => s.life > 0);
      return;
    }

    if (!this.alive) return;
    this.frame++;

    // invincibility countdown
    if (this.invincible > 0) this.invincible--;

    // steering
    const steerSpeed = this.boosting ? 7 : 5;
    if (this.keys['ArrowLeft'] || this.keys['KeyA']) this.playerX -= steerSpeed;
    if (this.keys['ArrowRight'] || this.keys['KeyD']) this.playerX += steerSpeed;

    // boost
    this.boosting = (this.keys['ArrowUp'] || this.keys['KeyW'] || this.keys['Space']) && this.boost > 0;
    if (this.boosting) {
      this.speed = this.baseSpeed + 6;
      this.boost = Math.max(0, this.boost - .6);
      if (this.frame % 3 === 0) {
        this.addSparks(this.playerX, this.playerY + 50);
      }
    } else {
      this.speed = this.baseSpeed;
      this.boost = Math.min(100, this.boost + .15);
    }

    // clamp player
    this.playerX = Math.max(ROAD_LEFT + 18, Math.min(ROAD_RIGHT - 18, this.playerX));

    // update track
    trackOffset = (trackOffset + this.speed) % 99999;

    // score
    this.score += Math.floor(this.speed);

    // difficulty
    if (this.score > 2000) this.baseSpeed = 5;
    if (this.score > 5000) this.baseSpeed = 6;
    if (this.score > 10000) this.baseSpeed = 7;
    if (this.score > 20000) this.baseSpeed = 8;
    this.rivalInterval = Math.max(30, 80 - Math.floor(this.score / 1000) * 4);

    // spawn rivals
    this.rivalTimer++;
    if (this.rivalTimer >= this.rivalInterval) {
      this.rivalTimer = 0;
      this.spawnRival();
      if (Math.random() < .20) this.spawnRival();
    }

    // move rivals
    for (const r of this.rivals) {
      r.y += r.speed;
    }

    // remove off-screen rivals
    this.rivals = this.rivals.filter(r => r.y < H + 80);

    // collision
    for (const r of this.rivals) {
      const dx = Math.abs(this.playerX - r.x);
      const dy = Math.abs(this.playerY - r.y);
      if (dx < 28 && dy < 46) {
        if (this.invincible > 0) continue;
        this.crashing = true;
        this.crashTimer = 90;
        this.alive = false;
        for (let i = 0; i < 40; i++) this.addSparks(this.playerX, this.playerY);
        break;
      }
    }

    // sparks
    for (const s of this.sparks) {
      s.x += s.vx;
      s.y += s.vy;
      s.life--;
    }
    this.sparks = this.sparks.filter(s => s.life > 0);
  }

  draw() {
    drawTrack();

    // rivals
    for (const r of this.rivals) {
      drawRivalCar(r.x, r.y, r.colorIdx);
    }

    // sparks
    for (const s of this.sparks) {
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.life / 22;
      ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;

    // crash screen flash
    if (this.crashing && this.crashTimer > 70) {
      const flashAlpha = (this.crashTimer - 70) / 20 * 0.4;
      ctx.fillStyle = `rgba(255,30,0,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }

    // player - flash rapidly during crash, then vanish
    if (this.crashing) {
      if (this.crashTimer > 40) {
        // rapid flash for first 0.7s
        if (Math.floor(this.crashTimer / 3) % 2 === 0) {
          drawPlayerCar(this.playerX, this.playerY);
        }
      } else if (this.crashTimer > 10) {
        // slow fade
        if (Math.floor(this.crashTimer / 6) % 2 === 0) {
          ctx.globalAlpha = 0.5;
          drawPlayerCar(this.playerX, this.playerY);
          ctx.globalAlpha = 1;
        }
      }
      // after crashTimer <= 10, car is gone (wrecked)
    } else {
      drawPlayerCar(this.playerX, this.playerY);
    }

    // invincibility shield
    if (this.invincible > 0 && !this.crashing) {
      const alpha = 0.3 + Math.sin(this.frame * 0.2) * 0.2;
      ctx.strokeStyle = `rgba(0,212,255,${alpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.playerX, this.playerY + 24, 32, 0, Math.PI * 2);
      ctx.stroke();
      const secLeft = Math.ceil(this.invincible / 60);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(secLeft + 's', this.playerX, this.playerY - 30);
    }

    // boost flame
    if (this.boosting) {
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = ['#ff0000','#ff6600','#ffcc00','#ffff00','#fff'][i];
        const fy = this.playerY + 28 + i * 4 + Math.random() * 6;
        const fw = 8 - i + Math.random() * 4;
        ctx.fillRect(this.playerX - fw/2, fy, fw, 6);
      }
    }

    // HUD update
    document.getElementById('score').textContent = this.score;
    document.getElementById('speed').textContent = Math.floor(this.speed * 30);
    document.getElementById('boost-inner').style.width = this.boost + '%';
  }
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';
  game = new Game();
  loop();
}

function endGame() {
  if (game.score > bestScore) {
    bestScore = game.score;
    localStorage.setItem('f1best', bestScore);
  }
  document.getElementById('final-score').textContent = game.score + ' pts';
  document.getElementById('best-score').textContent = 'Best: ' + bestScore;
  document.getElementById('gameover-screen').style.display = 'flex';
}

let rafId = null;
function loop() {
  if (!game) return;
  game.update();
  game.draw();
  if (!game.alive && game.crashTimer <= 0) {
    endGame();
    game = null;
    return;
  }
  rafId = requestAnimationFrame(loop);
}

// Input
document.addEventListener('keydown', e => {
  if (!game) return;
  if (e.code === 'KeyP') { game.paused = !game.paused; return; }
  game.keys[e.code] = true;
  e.preventDefault();
});
document.addEventListener('keyup', e => {
  if (!game) return;
  game.keys[e.code] = false;
  e.preventDefault();
});

// Mobile controls
const btnL = document.getElementById('btn-left');
const btnR = document.getElementById('btn-right');
const btnB = document.getElementById('btn-boost');

function setKey(code, val) { if (game) game.keys[code] = val; }
btnL.addEventListener('pointerdown', () => setKey('ArrowLeft', true));
btnL.addEventListener('pointerup', () => setKey('ArrowLeft', false));
btnL.addEventListener('pointerleave', () => setKey('ArrowLeft', false));
btnR.addEventListener('pointerdown', () => setKey('ArrowRight', true));
btnR.addEventListener('pointerup', () => setKey('ArrowRight', false));
btnR.addEventListener('pointerleave', () => setKey('ArrowRight', false));
btnB.addEventListener('pointerdown', () => setKey('ArrowUp', true));
btnB.addEventListener('pointerup', () => setKey('ArrowUp', false));
btnB.addEventListener('pointerleave', () => setKey('ArrowUp', false));

// Draw initial track
ctx.fillStyle = '#0a0a0a';
ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
